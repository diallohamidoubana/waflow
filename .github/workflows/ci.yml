name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: quality-gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Check lint rules (ESLint)
        run: pnpm lint

      - name: Check types (TypeScript)
        run: pnpm typecheck

      - name: Check architecture boundaries
        run: pnpm test:architecture

      - name: Run automated test suite (Vitest)
        run: pnpm test

      - name: Build monorepo packages and apps (Turborepo)
        run: pnpm build

  database-gates:
    name: database-gates (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: waflow_ci
          POSTGRES_USER: waflow
          POSTGRES_PASSWORD: waflow_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waflow -d waflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm db:validate
        env:
          DATABASE_URL: postgresql://waflow:waflow_ci_password@localhost:5432/waflow_ci?schema=public

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Deploy Migrations to Empty Database
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://waflow:waflow_ci_password@localhost:5432/waflow_ci?schema=public

      - name: Run Database Integration Tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://waflow:waflow_ci_password@localhost:5432/waflow_ci?schema=public
